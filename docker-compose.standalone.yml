version: '3.9'

# ==============================================================================
# 🚀 Daily Lover — Docker Compose Autónomo para Servidores Propios de María (AWS)
# Diseñado para desplegarse de manera 100% independiente en cualquier instancia EC2
# Sin dependencias de redes externas (zero-coupling), con SSL automático Let's Encrypt.
# ==============================================================================

services:

  # ─── REVERSE PROXY & SSL (TRAEFIK AUTÓNOMO) ─────────────────────────────────
  proxy:
    image: traefik:v2.10
    container_name: dl_proxy
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@dailylover.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - dl_network

  # ─── BASE DE DATOS: POSTGRESQL 16 + PGVECTOR ───────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dailylover}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - dl_network
    deploy:
      resources:
        limits:
          memory: 2048m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dailylover}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CACHÉ & TASK BROKER: REDIS 7 ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dl_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - dl_network
    deploy:
      resources:
        limits:
          memory: 160m

  # ─── BACKEND FASTAPI + PANEL ADMIN ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dl_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - dl_uploads:/app/static/uploads
      - backups_data:/backups
    networks:
      - dl_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 1536m

  # ─── WORKER EN SEGUNDO PLANO (CELERY + BEAT) ────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dl_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --beat --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - dl_uploads:/app/static/uploads
    networks:
      - dl_network
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres_data:
  redis_data:
  dl_uploads:
  traefik_acme:
  backups_data:

networks:
  dl_network:
    driver: bridge
