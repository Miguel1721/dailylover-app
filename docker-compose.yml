version: '3.9'

services:

  # ─── POSTGRESQL + PGVECTOR ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks: [dl_network]
    deploy:
      resources:
        limits: {memory: 256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  # ─── REDIS ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dl_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    networks: [dl_network]
    deploy:
      resources:
        limits: {memory: 80m}

  # ─── FASTAPI BACKEND ────────────────────────────────
  api:
    build: {context: ./backend, dockerfile: Dockerfile}
    container_name: dl_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - ./backend:/app
      - dl_uploads:/app/static/uploads
    networks:
      - dl_network
      - produccion_web_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=produccion_web_network"
      - "traefik.http.routers.dlapi.rule=Host(`prueba-daily.agentesia.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`))"
      - "traefik.http.routers.dlapi.entrypoints=websecure"
      - "traefik.http.routers.dlapi.tls=true"
      - "traefik.http.routers.dlapi.priority=1000"
      - "traefik.http.services.dlapi.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits: {memory: 512m}

  # ─── CELERY WORKER ──────────────────────────────────
  worker:
    build: {context: ./backend}
    container_name: dl_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --beat --loglevel=warning --concurrency=2
    env_file: .env
    depends_on: [redis, postgres]
    networks: [dl_network]
    deploy:
      resources:
        limits: {memory: 200m}

  # ─── METABASE DASHBOARD ─────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: dl_metabase
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_OPTS: "-Xmx256m"
    depends_on: [postgres]
    networks: [dl_network]
    deploy:
      resources:
        limits: {memory: 320m}

  # ─── PORTAINER ──────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: dl_portainer
    restart: unless-stopped
    ports:
      - "9090:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [dl_network]

volumes:
  dl_uploads:
    driver: local
  postgres_data:
  redis_data:
  portainer_data:

networks:
  dl_network:
    driver: bridge
  produccion_web_network:
    external: true
