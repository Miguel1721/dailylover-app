version: '3.9'

services:

  # ─── POSTGRESQL ──────────────────────────────────────
  np_postgres:
    image: pgvector/pgvector:pg16
    container_name: np_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - np_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks: [np_network]
    deploy:
      resources:
        limits: {memory: 256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  # ─── REDIS ──────────────────────────────────────────
  np_redis:
    image: redis:7-alpine
    container_name: np_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes: [np_redis_data:/data]
    networks: [np_network]
    deploy:
      resources:
        limits: {memory: 80m}

  # ─── FASTAPI BACKEND ────────────────────────────────
  np_api:
    build: {context: ./backend, dockerfile: Dockerfile}
    container_name: np_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      np_postgres: {condition: service_healthy}
      np_redis: {condition: service_started}
    volumes: [./backend:/app]
    networks:
      - np_network
      - produccion_web_network
    deploy:
      resources:
        limits: {memory: 300m}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.np_api.rule=Host(`nightpulse.agentesia.cloud`) || (Host(`prueba-daily.agentesia.cloud`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/auth`) || PathPrefix(`/api/brands`) || PathPrefix(`/api/dashboard`) || PathPrefix(`/api/inventory`) || PathPrefix(`/api/cash-registers`) || PathPrefix(`/api/staff`) || PathPrefix(`/api/crm`) || PathPrefix(`/api/analytics`) || PathPrefix(`/api/compliance`) || PathPrefix(`/api/alerts`)))"
      - "traefik.http.routers.np_api.entrypoints=websecure"
      - "traefik.http.routers.np_api.tls.certresolver=myresolver"
      - "traefik.http.services.np_api.loadbalancer.server.port=8000"

  # ─── CELERY WORKER ──────────────────────────────────
  np_worker:
    build: {context: ./backend}
    container_name: np_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --beat --loglevel=warning --concurrency=2
    env_file: .env
    depends_on: [np_redis, np_postgres]
    networks: [np_network]
    deploy:
      resources:
        limits: {memory: 200m}

volumes:
  np_postgres_data:
  np_redis_data:

networks:
  np_network:
    driver: bridge
  produccion_web_network:
    external: true
